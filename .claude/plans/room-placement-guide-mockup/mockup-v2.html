<title>Auto-place Guide</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;700;800&family=Chivo:wght@400;500;600;700&family=Martian+Mono:wght@400;500;600&family=Architects+Daughter&display=swap">
<style>
/* Layout: three columns. The step list, the current step, and the sample room that shows the result of the step. */
:root {
  --ink: #131b21;
  --muted: #57676f;
  --line: #c2ced4;
  --paper: #eef2f4;
  --surface: #ffffff;
  --surface-2: #e7edf0;
  --accent: #175a8a;
  --accent-soft: #dbe9f2;
  --accent-ink: #0f4267;
  --hvac: #3f7cc9;
  --warn: #9a5b00;
  --warn-soft: #fbeed6;
  --band: #efd3a0;
  --bad: #b3261e;
  --bad-soft: #f9dedc;
  --ok: #2f7d4f;
  --ok-soft: #dcefe3;
  --font-display: 'Big Shoulders Display', 'Arial Narrow', sans-serif;
  --font-ui: 'Chivo', system-ui, sans-serif;
  --font-mono: 'Martian Mono', ui-monospace, Consolas, monospace;
  --font-hand: 'Architects Daughter', 'Comic Sans MS', cursive;
  color-scheme: light;
}
* { box-sizing: border-box; }
body { background: var(--paper); color: var(--ink); font-family: var(--font-ui); font-size: 14px; line-height: 1.45; }
.wrap { padding-inline: 16px; padding-block: 16px 40px; max-width: 1480px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.top { background: var(--surface); border: 2px solid var(--ink); display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; padding: 8px 14px; }
.top h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 22px; letter-spacing: 0.01em; text-wrap: balance; }
.top .rule { font-family: var(--font-mono); font-size: 11.5px; color: var(--muted); }
.top .tag { margin-left: auto; font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.08em; text-transform: uppercase; border: 1.5px solid var(--ink); padding: 2px 8px; background: var(--warn-soft); }
.note { font-size: 12px; color: var(--muted); margin: 0; }

.grid { display: grid; grid-template-columns: 210px minmax(0, 1fr) minmax(0, 460px); gap: 14px; align-items: start; }
@media (max-width: 1150px) { .grid { grid-template-columns: minmax(0, 1fr); } }

/* Step list */
.steps { display: flex; flex-direction: column; gap: 6px; position: sticky; top: env(safe-area-inset-top, 0px); }
@media (max-width: 1150px) { .steps { position: static; flex-direction: row; overflow-x: auto; padding-bottom: 4px; } }
.step-btn { display: grid; grid-template-columns: 26px 1fr; gap: 2px 8px; text-align: left; background: var(--surface); border: 1.5px solid var(--line); border-radius: 3px; padding: 8px 10px; cursor: pointer; min-width: 150px; }
.step-btn:hover { border-color: var(--ink); }
.step-btn.on { border: 2px solid var(--ink); box-shadow: 3px 3px 0 var(--ink); }
.step-btn .n { grid-row: span 2; width: 26px; height: 26px; display: grid; place-items: center; font-family: var(--font-mono); font-size: 12px; font-weight: 600; border: 1.5px solid var(--ink); border-radius: 50%; }
.step-btn .t { font-weight: 600; font-size: 13.5px; }
.step-btn .s { font-size: 11px; color: var(--muted); }
.step-btn.ok .n { background: var(--ok-soft); border-color: var(--ok); color: var(--ok); }
.step-btn.warn .n { background: var(--warn-soft); border-color: var(--warn); color: var(--warn); }
.step-btn.warn .s { color: var(--warn); }
.step-btn.bad .n { background: var(--bad-soft); border-color: var(--bad); color: var(--bad); }
.step-btn.bad .s { color: var(--bad); }

/* Step card */
.card { background: var(--surface); border: 2px solid var(--ink); border-radius: 4px; box-shadow: 4px 4px 0 var(--ink); padding: 18px 20px; display: flex; flex-direction: column; gap: 16px; min-width: 0; }
.card h2 { margin: 0; font-family: var(--font-display); font-weight: 700; font-size: 26px; text-wrap: balance; }
.card h3 { margin: 0; font-size: 12px; font-family: var(--font-mono); font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.lead { margin: 0; max-width: 64ch; color: var(--muted); }
.section { display: flex; flex-direction: column; gap: 10px; }
.nav { display: flex; gap: 10px; justify-content: space-between; border-top: 1.5px dashed var(--line); padding-top: 14px; }
.btn { border: 1.5px solid var(--ink); background: var(--surface); padding: 7px 14px; border-radius: 3px; cursor: pointer; font-weight: 600; }
.btn.primary { background: var(--accent); color: #fff; border-color: var(--accent-ink); box-shadow: 2px 2px 0 var(--ink); }
.btn:disabled { opacity: 0.45; cursor: default; }

.field { display: grid; grid-template-columns: minmax(0, 190px) minmax(0, 1fr); gap: 8px 12px; align-items: center; }
.field label { font-size: 13px; }
.inline { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
input.txt, select.txt { border: 1.5px solid var(--line); border-radius: 3px; padding: 6px 8px; background: var(--surface); font-family: var(--font-mono); font-size: 12.5px; width: 100%; max-width: 320px; }
select.unit { border: 1.5px solid var(--accent); border-radius: 3px; padding: 3px 6px; background: var(--surface); font-family: var(--font-mono); font-size: 12px; color: var(--accent-ink); }
input.num { border: 1.5px solid var(--accent); border-radius: 3px; padding: 3px 6px; width: 74px; font-family: var(--font-mono); font-size: 13px; background: var(--accent-soft); color: var(--accent-ink); text-align: right; }
input.num::placeholder { color: var(--muted); opacity: 0.8; }
input.txt:focus, input.num:focus, select.txt:focus, select.unit:focus { border-color: var(--ink); outline: none; }

/* Choice cards */
.choices { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.choices.small { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
.choice { position: relative; border: 1.5px solid var(--line); border-radius: 3px; background: var(--surface); padding: 10px; text-align: left; cursor: pointer; display: flex; flex-direction: column; gap: 6px; }
.choice:hover { border-color: var(--ink); }
.choice.on { border: 2px solid var(--accent); background: var(--accent-soft); }
.choice .ct { font-weight: 600; font-size: 13px; padding-right: 22px; }
.choice .cd { font-size: 11.5px; color: var(--muted); }
.choice .cf { font-family: var(--font-mono); font-size: 10.5px; color: var(--accent-ink); }
.choice svg { width: 100%; height: auto; display: block; background: var(--paper); border-radius: 2px; }

/* Tooltip */
.tip { position: absolute; top: 8px; right: 8px; width: 18px; height: 18px; border-radius: 50%; border: 1.5px solid var(--accent); color: var(--accent); background: var(--surface); font: 600 11px/15px var(--font-mono); text-align: center; cursor: help; }
.tip .tt { display: none; position: absolute; z-index: 20; top: 24px; right: -9px; width: min(290px, 78vw); padding: 10px 12px; background: var(--ink); color: var(--surface); border-radius: 3px; font: 400 12px/1.5 var(--font-ui); text-align: left; box-shadow: 3px 3px 0 var(--accent); }
.tip .tt b { color: #fff; }
.tip .tt dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 3px 8px; }
.tip .tt dt { font-family: var(--font-mono); color: #9fc6e4; }
.tip .tt dd { margin: 0; }
.tip:hover .tt, .tip:focus .tt, .tip:focus-within .tt { display: block; }

/* Chips */
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { border: 1.5px solid var(--line); border-radius: 999px; padding: 4px 12px; background: var(--surface); cursor: pointer; font-size: 13px; display: inline-flex; gap: 6px; align-items: center; }
.chip .c { font-family: var(--font-mono); font-size: 11px; color: var(--muted); }
.chip.on { background: var(--accent); border-color: var(--accent-ink); color: #fff; }
.chip.on .c { color: var(--accent-soft); }

/* Formula lines */
.formula { display: flex; flex-direction: column; gap: 0; border: 1.5px solid var(--line); border-radius: 3px; }
.term { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 8px; padding: 9px 12px; border-bottom: 1px solid var(--surface-2); font-size: 13.5px; }
.term:last-child { border-bottom: 0; }
.term .op { font-family: var(--font-mono); color: var(--muted); }
.term .sym { font-family: var(--font-mono); font-size: 11px; font-weight: 600; color: var(--accent-ink); border: 1px solid var(--accent); border-radius: 2px; padding: 0 4px; }
.term .val { font-family: var(--font-mono); font-size: 12.5px; background: var(--surface-2); padding: 1px 6px; border-radius: 2px; }
.term .res { margin-left: auto; font-family: var(--font-mono); font-weight: 600; font-variant-numeric: tabular-nums; }
.term.total { background: var(--surface-2); font-weight: 600; }
.term.result { background: var(--accent-soft); }
.missing { color: var(--warn); background: var(--warn-soft) !important; font-weight: 600; }

/* Data checklist */
.checks { display: flex; flex-direction: column; gap: 8px; }
.check { display: grid; grid-template-columns: 22px minmax(0, 1fr); gap: 4px 10px; padding: 10px 12px; border-radius: 3px; border: 1.5px solid var(--line); }
.check .ic { width: 22px; height: 22px; border-radius: 50%; display: grid; place-items: center; font-size: 12px; font-weight: 700; border: 1.5px solid currentColor; }
.check.ok .ic { color: var(--ok); background: var(--ok-soft); }
.check.warn { border-color: var(--warn); background: var(--warn-soft); }
.check.warn .ic { color: var(--warn); }
.check.bad { border-color: var(--bad); background: var(--bad-soft); }
.check.bad .ic { color: var(--bad); }
.check.off { opacity: 0.55; }
.check.off .ic { color: var(--muted); }
.check b { font-weight: 600; }
.check .sub { font-size: 12px; color: var(--muted); }
.check.bad .sub { color: var(--ink); }

.callout { border-left: 4px solid var(--warn); background: var(--warn-soft); padding: 10px 12px; display: flex; flex-wrap: wrap; gap: 8px; align-items: center; font-size: 13px; }
.callout.bad { border-left-color: var(--bad); background: var(--bad-soft); }
.callout.info { border-left-color: var(--accent); background: var(--accent-soft); }

/* Limit fields with small diagrams */
.limits { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.limit { border: 1.5px solid var(--line); border-radius: 3px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }
.limit svg { width: 100%; height: 70px; background: var(--paper); border-radius: 2px; }
.limit .lt { font-weight: 600; font-size: 13px; }
.limit .row { display: flex; gap: 6px; align-items: center; font-size: 12.5px; }

/* Side panel */
.side { display: flex; flex-direction: column; gap: 10px; position: sticky; top: env(safe-area-inset-top, 0px); min-width: 0; }
@media (max-width: 1150px) { .side { position: static; } }
.panel { background: var(--surface); border: 2px solid var(--ink); border-radius: 4px; padding: 12px; display: flex; flex-direction: column; gap: 10px; min-width: 0; }
.panel-head { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; justify-content: space-between; }
.panel-head .pt { font-family: var(--font-display); font-weight: 700; font-size: 18px; }
.seg { display: inline-flex; border: 1.5px solid var(--ink); border-radius: 2px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 3px 10px; cursor: pointer; font-size: 12px; }
.seg button.on { background: var(--ink); color: var(--surface); }
.facts { display: flex; flex-wrap: wrap; gap: 6px; }
.fact { font-family: var(--font-mono); font-size: 11px; background: var(--surface-2); border-radius: 2px; padding: 3px 7px; }
.fact small { color: var(--muted); font-size: 10px; }
.fact.missing { border: 1px solid var(--warn); }
.plan { width: 100%; height: auto; display: block; background: var(--paper); border: 1.5px solid var(--line); border-radius: 2px; }
.plan .room { cursor: pointer; }
.legend { display: flex; flex-wrap: wrap; gap: 4px 14px; font-size: 11px; color: var(--muted); }
.legend span::before { content: ''; display: inline-block; width: 10px; height: 10px; margin-right: 5px; vertical-align: -1px; border: 1px solid var(--line); background: var(--sw); }
.legend span.plain::before { display: none; }

.chain { display: flex; flex-direction: column; border: 1.5px solid var(--line); border-radius: 3px; }
.chain .cr { display: grid; grid-template-columns: minmax(0, 1fr) 44px; gap: 2px 10px; padding: 7px 10px; border-bottom: 1px solid var(--surface-2); align-items: center; }
.chain .cr:last-child { border-bottom: 0; }
.chain .cl { font-size: 12.5px; }
.chain .cw { grid-column: 1; font-size: 11px; color: var(--muted); }
.chain .cn { grid-row: 1 / span 2; grid-column: 2; font-family: var(--font-mono); font-weight: 600; font-size: 16px; text-align: right; font-variant-numeric: tabular-nums; }
.chain .cr.win { background: var(--accent-soft); }
.chain .cr.win .cn { color: var(--accent-ink); }
.chain .cr.res { background: var(--ink); color: var(--surface); }
.chain .cr.res .cw { color: var(--line); }
.chain .cr.cap { background: var(--warn-soft); }
.chain .cr.blocked { background: var(--warn-soft); color: var(--warn); }

.tbl-wrap { overflow-x: auto; border: 1.5px solid var(--line); border-radius: 3px; }
table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
th, td { text-align: left; padding: 7px 10px; border-bottom: 1px solid var(--surface-2); white-space: nowrap; }
th { font-family: var(--font-mono); font-weight: 500; font-size: 10.5px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); background: var(--surface-2); }
td.n { font-family: var(--font-mono); text-align: right; font-variant-numeric: tabular-nums; }
tr.bad td { color: var(--warn); background: var(--warn-soft); }
tr.err td { color: var(--bad); background: var(--bad-soft); }
tr.sel td { background: var(--accent-soft); }
.status { font-size: 13px; padding: 8px 12px; border-radius: 3px; background: var(--ok-soft); color: var(--ok); border: 1.5px solid var(--ok); }
.hand { font-family: var(--font-hand); }
@media (prefers-reduced-motion: no-preference) { .step-btn, .choice, .chip { transition: border-color .12s, background-color .12s; } }
</style>

<div class="wrap">
  <header class="top">
    <h1>Place stamps in rooms</h1>
    <span class="rule" id="rule-name"></span>
    <span class="tag">Mockup v2</span>
  </header>
  <p class="note">This mockup shows one rule from start to end on a fixed sample floor. The numbers are examples, not a standard. Change any value: the sample room on the right shows the result at once.</p>
  <div class="grid">
    <nav class="steps" id="steps" aria-label="Steps"></nav>
    <main class="card" id="step"></main>
    <aside class="side" id="side"></aside>
  </div>
</div>

<script>
// ---------- Sample floor (m, y down) ----------
const TYPES = [
  { id: 'office', name: 'Office' },
  { id: 'meeting', name: 'Meeting room' },
  { id: 'classroom', name: 'Classroom' },
  { id: 'storage', name: 'Storage' },
  { id: 'toilet', name: 'Toilet' },
  { id: 'technical', name: 'Technical room' },
  { id: 'corridor', name: 'Corridor' },
];
const typeName = (id) => TYPES.find((t) => t.id === id)?.name ?? 'No type';
const ROOMS = [
  { id: 'r214', name: 'Office 2.14', type: 'office', poly: [[0, 0], [9.6, 0], [9.6, 4.2], [5.6, 4.2], [5.6, 7.2], [0, 7.2]] },
  { id: 'r215', name: 'Copy room 2.15', type: 'storage', poly: [[5.6, 4.2], [9.6, 4.2], [9.6, 7.2], [5.6, 7.2]] },
  { id: 'r212', name: 'Office 2.12', type: 'office', poly: [[9.6, 0], [15.6, 0], [15.6, 7.2], [9.6, 7.2]] },
  { id: 'r210', name: 'Meeting 2.10', type: 'meeting', people: 12, poly: [[15.6, 0], [20.4, 0], [20.4, 7.2], [15.6, 7.2]] },
  { id: 'r209', name: 'Toilets 2.09', type: 'toilet', poly: [[20.4, 0], [23.4, 0], [23.4, 3.6], [20.4, 3.6]] },
  { id: 'r208', name: 'Technical 2.08', type: 'technical', poly: [[20.4, 3.6], [23.4, 3.6], [23.4, 7.2], [20.4, 7.2]] },
  { id: 'r201', name: 'Corridor 2.01', type: 'corridor', poly: [[0, 7.2], [23.4, 7.2], [23.4, 9.2], [0, 9.2]] },
  { id: 'r220', name: 'Classroom 2.20', type: 'classroom', poly: [[0, 9.2], [12, 9.2], [12, 16.4], [0, 16.4]] },
  { id: 'r221', name: 'Room 2.21', type: null, poly: [[12, 9.2], [23.4, 9.2], [23.4, 16.4], [12, 16.4]] },
];

const STAMPS = [
  { id: 'diffuser', name: 'Ceiling diffuser 600×600', note: 'Square supply diffuser' },
  { id: 'swirl', name: 'Swirl diffuser Ø400', note: 'Round supply diffuser' },
  { id: 'grille', name: 'Wall grille 400×150', note: 'Blows in one direction' },
];

// ---------- Units ----------
const M2_PER_FT2 = 0.09290304, M_PER_FT = 0.3048;
const FLOW_UNITS = ['dm³/s', 'l/s', 'm³/h', 'm³/s', 'cfm', 'W', 'kW'];
// Air changes give m³/h first; MepApp converts to the chosen unit.
const ACH_UNITS = { 'm³/h': 1, 'dm³/s': 1 / 3.6, 'l/s': 1 / 3.6, 'm³/s': 1 / 3600, cfm: 1 / 1.69901 };
const AREA_UNITS = { m2: 'm²', ft2: 'ft²' };
const LIGHT_UNITS = { lx: 'lx, floor area in m²', fc: 'fc (foot-candle), floor area in ft²' };
const LEN_UNITS = { m: 'm, m²', ft: 'ft, ft²' };

const METHODS = [
  { id: 'perArea', name: 'Per area', f: 'a × floor area', fields: ['perM2', 'minimum'], unit: 'dm³/s', cap: '50',
    tip: '<b>Amount = a × floor area</b><dl><dt>a</dt><dd>The amount for each m² (or ft²) of floor area, for example 1.2 dm³/s per m².</dd><dt>area</dt><dd>MepApp measures it from the room outline and the scale of the page.</dd></dl>' },
  { id: 'perPerson', name: 'Per person', f: 'a × persons', fields: ['perPerson', 'minimum'], unit: 'dm³/s', cap: '50',
    tip: '<b>Amount = a × persons</b><dl><dt>a</dt><dd>The amount for each person, for example 7 dm³/s per person.</dd><dt>persons</dt><dd>The number of the room, or floor area ÷ area per person of the room type, rounded down.</dd></dl>' },
  { id: 'perPersonArea', name: 'Per person + per area', f: 'a × persons + b × floor area', fields: ['perPerson', 'perM2', 'minimum'], unit: 'dm³/s', cap: '50',
    tip: '<b>Amount = a × persons + b × floor area</b><dl><dt>a</dt><dd>The amount for each person, for example 7 dm³/s per person.</dd><dt>b</dt><dd>The amount for each m² (or ft²) of floor area, for example 0.7 dm³/s per m². It removes the pollution from the building itself.</dd><dt>persons</dt><dd>The number of the room, or floor area ÷ area per person, rounded down.</dd></dl>' },
  { id: 'airChanges', name: 'Air changes per hour', f: 'n × room volume', fields: ['perM3', 'minimum'], unit: 'm³/h', cap: '300',
    tip: '<b>Amount = n × room volume</b><dl><dt>n</dt><dd>The air changes per hour: how many times in one hour the full air volume of the room is replaced.</dd><dt>volume</dt><dd>Floor area × ceiling height.</dd></dl>' },
  { id: 'fixed', name: 'Fixed per room', f: 'a per room', fields: ['fixed'], unit: 'dm³/s', cap: '',
    tip: '<b>Amount = a</b><dl><dt>a</dt><dd>The same amount for each room, for example 25 dm³/s for each toilet. Without a capacity per stamp, each room gets one stamp.</dd></dl>' },
  { id: 'lighting', name: 'Lighting (lumen method)', f: 'E × floor area ÷ (UF × MF)', fields: [], unit: 'lm', cap: '3600',
    tip: '<b>Light = E × floor area ÷ (UF × MF)</b>, in lumen (lm)<dl><dt>E</dt><dd>The illuminance on the work plane, in lux (lx) or foot-candle (fc).</dd><dt>UF</dt><dd>Utilisation factor: the part of the lamp light that reaches the work plane, from 0 to 1.</dd><dt>MF</dt><dd>Maintenance factor: the part of the light that stays after dirt and lamp ageing, from 0 to 1.</dd></dl>' },
  { id: 'coverage', name: 'By coverage', f: 'stamps until circles of r cover the room', fields: [], unit: '', cap: '',
    tip: '<b>Count = the stamps that cover each point of the room</b><dl><dt>r</dt><dd>Each stamp covers a circle with radius r. The smallest of these sets r: max spacing ÷ √2, max distance to a wall × √2, √(max area per stamp ÷ 2).</dd></dl>Use it for smoke detectors, sprinklers and loudspeakers.' },
];

const LAYOUTS = [
  { id: 'center', name: 'Center', d: 'One stamp in the middle of the room. More than one stamp uses the grid.' },
  { id: 'grid', name: 'Grid', d: 'Rows along the long side of the room. Three styles for the rows.' },
  { id: 'evenSpread', name: 'Even spread', d: 'Each stamp moves to the middle of its own part of the room. Good for L-shaped rooms.' },
  { id: 'perimeter', name: 'Along the walls', d: 'Stamps at equal distances along the walls, turned to face into the room.' },
];
const GRID_STYLES = [
  { id: 'spread', name: 'Spread last row', d: 'An incomplete row spreads over the full width.' },
  { id: 'aligned', name: 'Aligned columns', d: 'Every stamp stays in a column. A cell can stay empty.' },
  { id: 'staggered', name: 'Staggered', d: 'Rows stay aligned. Each second row moves half a cell.' },
];

// ---------- State ----------
const S = {
  step: 1,
  view: null,
  sample: 'r214',
  name: 'Supply air per person + area',
  stamp: 'diffuser',
  types: ['office', 'meeting', 'classroom'],
  roomType: { r221: '' },
  areaPerPerson: { office: '', classroom: '2.5', meeting: '' },
  ceiling: '2.70',
  method: 'perPersonArea',

      if (r.radius) for (const { p } of res.points) out += `<circle cx="${p[0]}" cy="${p[1]}" r="${r.radius}" fill="var(--accent)" fill-opacity="0.07" stroke="var(--accent)" stroke-width="1" stroke-dasharray="4 3" vector-effect="non-scaling-stroke" clip-path="url(#clip-sample)"/>`;
      if (S.step === 4 && r.gap) res.points.forEach(({ p }, i) => { const bad = res.close?.has(i); out += `<circle cx="${p[0]}" cy="${p[1]}" r="${r.gap / 2}" fill="${bad ? 'var(--bad)' : 'var(--ok)'}" fill-opacity="${bad ? 0.22 : 0.12}" stroke="${bad ? 'var(--bad)' : 'var(--ok)'}" stroke-width="1" vector-effect="non-scaling-stroke"/>`; });
    }
    out += `<text x="${b.minX}" y="${b.minY - 0.7}" font-size="0.42" font-family="var(--font-ui)" font-weight="700" fill="var(--ink)">${esc(sample.name)}</text>`;
  }
  for (const room of ROOMS) {
    if (!showStamps(room)) continue;
    const res = calc(room); if (!res.points) continue;
    res.points.forEach(({ p, rot }, i) => { out += stampSvg(S.stamp, p, rot, { preview: !S.placed, size: mode === 'room' ? 0.6 : 0.75, color: res.close?.has(i) ? 'var(--bad)' : undefined }); });
  }
  for (const room of ROOMS) {
    if (mode === 'room' && room.id === S.sample) continue;
    const untyped = roomTypeOf(room) === null; const st = state(room);
    const c = room.id === 'r214' ? [2.8, 3.6] : centroid(room.poly);
    const halo = `paint-order="stroke" stroke="var(--surface)" stroke-width="3" stroke-linejoin="round" vector-effect="non-scaling-stroke" pointer-events="none"`;
    out += `<text x="${c[0]}" y="${c[1] - fs * 0.3}" font-size="${fs}" text-anchor="middle" font-family="var(--font-ui)" font-weight="600" fill="var(--ink)" ${halo}>${esc(room.name)}</text>`;
    out += `<text x="${c[0]}" y="${c[1] + fs * 0.9}" font-size="${fs * 0.75}" text-anchor="middle" font-family="var(--font-mono)" fill="${st === 'problem' ? 'var(--bad)' : st || untyped ? 'var(--warn)' : 'var(--muted)'}" ${halo}>${untyped ? 'no type' : st === 'blocked' ? 'missing data' : st === 'problem' ? 'does not fit' : fmt(polyArea(room.poly)) + ' m²'}</text>`;
  }
  return out + `</svg>`;
}

function thumbSvg(layoutId, style) {
  const rect = layoutId === 'grid';
  const poly = rect ? [[0, 0], [6, 0], [6, 4.5], [0, 4.5]] : [[0, 0], [6, 0], [6, 2.6], [3.4, 2.6], [3.4, 4.5], [0, 4.5]];
  const off = 0.5; const smp = samplesOf(poly, off, 260);
  let p;
  if (layoutId === 'center') { const c = centroid(poly); p = [{ p: isValid(poly, c, off) ? c : nearestValid(smp, c), rot: 0 }]; }
  else if (layoutId === 'grid') p = layoutGrid(poly, 5, off, smp, style ?? S.gridStyle).map((q) => ({ p: q, rot: 0 }));
  else if (layoutId === 'evenSpread') p = layoutEven(poly, 4, off, smp).map((q) => ({ p: q, rot: 0 }));
  else p = layoutPerimeter(poly, 7, off, smp);
  const id = layoutId === 'perimeter' ? 'grille' : 'diffuser';
  let s = `<svg viewBox="-0.6 -0.6 7.2 5.7" aria-hidden="true"><polygon points="${pts(poly)}" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.5" vector-effect="non-scaling-stroke"/>`;
  for (const { p: q, rot } of p) s += stampSvg(id, q, rot, { size: 0.6, sw: 1.3 });
  return s + `</svg>`;
}
function stampCardSvg(id) { return `<svg viewBox="-1 -0.8 2 1.6" aria-hidden="true">${stampSvg(id, [0, 0], 0, { size: 1, sw: 2 })}</svg>`; }

// ---------- Step status ----------
const matched = () => ROOMS.filter(matches);

function stepStatus(n) {
  const m = matched();
  if (n === 1) return S.stamp ? ['ok', STAMPS.find((s) => s.id === S.stamp).name] : ['', 'Choose a stamp'];
  if (n === 2) { const u = untypedRooms(); if (u.length) return ['warn', `${u.length} room has no type`]; return m.length ? ['ok', `${m.length} rooms`] : ['warn', 'No room matches']; }
  if (n === 3) { const bad = m.filter((room) => calc(room).count == null); return bad.length ? ['warn', `${bad.length} rooms miss data`] : ['ok', method().name]; }
  if (n === 4) { const bad = m.filter((room) => calc(room).problems.some((p) => p.kind !== 'cover')); return bad.length ? ['bad', `${bad.length} room${bad.length === 1 ? '' : 's'}: stamps do not fit`] : ['ok', `${fmt(rule().off, 2)} m from walls`]; }
  if (n === 5) { const bad = m.filter((room) => calc(room).problems.some((p) => p.kind === 'cover')); const name = LAYOUTS.find((l) => l.id === S.layout).name + (S.layout === 'grid' ? `, ${GRID_STYLES.find((g) => g.id === S.gridStyle).name.toLowerCase()}` : ''); return bad.length ? ['bad', `${name}: room not covered`] : ['ok', name]; }
  if (n === 6) { const total = m.reduce((s, room) => s + (calc(room).count ?? 0), 0); return [S.placed ? 'ok' : '', S.placed ? `${total} stamps placed` : `${total} stamps to place`]; }
}

// ---------- Live values ----------
function live() {
  const r = rule(); const sample = ROOMS.find((x) => x.id === S.sample); const res = calc(sample); const v = res.v; const u = esc(r.unit);
  const m = {};
  m.unit = u;
  m.people = v.people ? `${v.people.count} persons` : `<span class="missing">? persons</span>`;
  m.area = S.method === 'lighting' ? (S.lightUnit === 'fc' ? `${fmt(areaIn(v.A, 'ft2'))} ft²` : `${fmt(v.A)} m²`) : `${fmt(areaIn(v.A, S.areaUnit))} ${AREA_UNITS[S.areaUnit]}`;
  m.volume = `${fmt(v.V)} m³`;
  const t = (x) => (x == null ? '' : `= ${fmt(x)} ${u}`);
  m['t-fixed'] = t(r.fixed);
  m['t-perPerson'] = r.perPerson !== undefined ? (v.people ? t(r.perPerson * v.people.count) : `<span class="missing">cannot calculate</span>`) : '';
  m['t-perM2'] = r.perM2 !== undefined ? t(r.perM2 * areaIn(v.A, S.areaUnit)) : '';
  m['t-perM3'] = r.perM3 !== undefined ? (S.achUnit === 'm³/h' ? t(r.perM3 * v.V) : `${fmt(r.perM3 * v.V)} m³/h ${t(r.perM3 * v.V * ACH_UNITS[S.achUnit])}`) : '';
  m['t-light'] = r.lighting ? t((r.lighting.lux * areaIn(v.A, S.lightUnit === 'fc' ? 'ft2' : 'm2')) / (r.lighting.uf * r.lighting.mf)) : '';
  m['t-min'] = r.minimum !== undefined && res.sum != null ? (res.sum < r.minimum ? `the minimum applies` : `not needed`) : '';
  m.required = res.required != null ? `${fmt(res.required)} ${u}` : `<span class="missing">missing room data</span>`;
  if (res.required == null && r.hasAmount) m.qtyline = `<span>Enter the missing room data first.</span>`;
  else if (r.capacity > 0 && res.required != null) m.qtyline = `<span>${fmt(res.required)} ÷ ${fmt(r.capacity)} = ${fmt(res.required / r.capacity, 2)}, rounded up</span><span class="res">${res.qty} stamp${res.qty === 1 ? '' : 's'}</span>`;
  else m.qtyline = `<span>No capacity: each room gets one stamp.</span><span class="res">1 stamp</span>`;
  const chk = (state, title, sub) => `<div class="check ${state}"><span class="ic">${state === 'ok' ? '✓' : state === 'warn' || state === 'bad' ? '!' : '–'}</span><div><b>${title}</b><div class="sub">${sub}</div></div></div>`;
  const ms = matched();
  const noPeople = ms.filter((room) => !valuesOf(room).people);
  m.checks = chk(r.needsArea ? 'ok' : 'off', 'Floor area', r.needsArea ? 'From the room outline and the scale 1:50 of page 1. All rooms have it.' : 'This calculation does not use it.') +
    chk(r.needsPeople ? (noPeople.length ? 'warn' : 'ok') : 'off', 'Number of persons', r.needsPeople ? (noPeople.length ? `${noPeople.length} room${noPeople.length === 1 ? '' : 's'} have no number: ${noPeople.map((x) => esc(x.name)).join(', ')}. Enter an area per person below.` : 'Each room has a number of persons.') : 'This calculation does not use it.') +
    chk(r.needsVolume ? 'ok' : 'off', 'Ceiling height (for the volume)', r.needsVolume ? `${S.ceiling} m from the drawing. A room or a room type can have its own height.` : 'This calculation does not use it.');
  for (const ty of Object.keys(S.areaPerPerson)) { const a = num(S.areaPerPerson[ty]); const rs = ms.filter((x) => roomTypeOf(x) === ty && x.people == null); m['app-' + ty] = a && rs.length ? rs.map((x) => `${esc(x.name.split(' ').pop())}: ${floorCount(polyArea(x.poly) / a)} p`).join(' · ') : rs.length ? `<span class="missing">${rs.length} room${rs.length === 1 ? '' : 's'} wait for this</span>` : ''; }
  m.radius = r.radius ? `<div class="formula"><div class="term result"><span>Each stamp covers a circle with a radius of</span><span class="val">${fmt(r.radius, 2)} m</span><span class="note">(${r.radiusFrom}, the smallest limit)</span></div><div class="term"><span>${esc(sample.name)} needs</span><span class="res">${res.base ?? '–'} stamps</span></div></div>` : `<div class="callout">Enter at least one coverage limit.</div>`;
  m.matchlist = ms.length ? `<div class="chips">${ms.map((x) => `<span class="chip" style="cursor:default">${esc(x.name)}<span class="c">${fmt(polyArea(x.poly))} m²</span></span>`).join('')}</div>` : `<p class="note">No room matches. Click at least one room type.</p>`;
  m.blocked = res.count == null && matches(sample) ? `<div class="callout"><span><b>${esc(sample.name)}</b> has missing data, so the plan shows no stamps.</span><button type="button" class="btn" data-act="go" data-v="3">Go to step 3</button></div>` : '';
  // step 4: the fit check of every room
  m.fitchecks = ms.map((x) => { const c = calc(x); if (c.count == null) return chk('off', esc(x.name), 'No count yet: missing data in step 3.'); const p = c.problems.filter((q) => q.kind !== 'cover'); return p.length ? chk('bad', `${esc(x.name)}: ${c.count} stamps do not fit`, p.map((q) => esc(q.text)).join(' ')) : chk('ok', `${esc(x.name)}: ${c.count} stamps fit`, r.gap ? `Each stamp is at least ${fmt(r.gap, 2)} m from the next one.` : 'No min distance between stamps.'); }).join('');
  // step 5
  const coverProblems = res.problems.filter((q) => q.kind === 'cover');
  if (coverProblems.length) m.layoutnote = `<div class="callout bad">${coverProblems.map((q) => esc(q.text)).join(' ')}</div>`;
  else if (S.layout === 'center' && (res.count ?? 0) > 1) m.layoutnote = `<div class="callout">This room needs ${res.count} stamps. Center places one stamp only, so MepApp uses the grid here.</div>`;
  else if (S.method === 'coverage' && S.layout === 'evenSpread') m.layoutnote = `<div class="callout info">With By coverage, MepApp selects Even spread. It uses the positions that the coverage calculation found, so every point of the room stays covered.</div>`;
  else m.layoutnote = '';
  // step 6
  const rows = ms.map((x) => { const c = calc(x); const bad = c.count == null; const err = c.problems.length > 0; const note = bad ? 'no number of persons' : err ? c.problems[0].kind === 'cover' ? 'not covered' : 'stamps do not fit' : c.maxHit ? 'max count reached' : c.minHit ? 'min count applies' : ''; return `<tr class="${bad ? 'bad' : err ? 'err' : x.id === S.sample ? 'sel' : ''}" data-act="sample" data-v="${x.id}" style="cursor:pointer"><td>${esc(x.name)}</td><td>${typeName(roomTypeOf(x))}</td><td class="n">${fmt(c.v.A)}</td>${r.needsPeople ? `<td class="n">${c.v.people ? c.v.people.count : '–'}</td>` : ''}${r.hasAmount ? `<td class="n">${c.required != null ? fmt(c.required) : '–'}</td>` : ''}<td class="n">${c.count ?? '–'}</td>${r.hasAmount ? `<td class="n">${c.each != null ? fmt(c.each) : '–'}</td>` : ''}<td>${note}</td></tr>`; }).join('');
  m.table = `<table><thead><tr><th>Room</th><th>Type</th><th>m²</th>${r.needsPeople ? '<th>Persons</th>' : ''}${r.hasAmount ? `<th>Required ${u}</th>` : ''}<th>Stamps</th>${r.hasAmount ? `<th>Each ${u}</th>` : ''}<th>Note</th></tr></thead><tbody>${rows}</tbody></table>`;
  const total = ms.reduce((s, x) => s + (calc(x).count ?? 0), 0); const skipped = ms.filter((x) => calc(x).count == null).length; const errs = ms.filter((x) => calc(x).problems.length).length;
  const others = ROOMS.length - ms.length;
  m.placebar = S.placed
    ? `<div class="status" role="status">MepApp placed ${total} stamps in ${ms.length - skipped} rooms. One Undo removes all of them. <button type="button" class="btn" data-act="undo" style="margin-left:8px">Undo</button></div>`
    : `<div class="inline" style="gap:10px"><button type="button" class="btn primary" data-act="place"${total ? '' : ' disabled'}>Place ${total} stamps</button><span class="note">${skipped ? `${skipped} room${skipped === 1 ? '' : 's'} skipped: missing data (step 3). ` : ''}${errs ? `${errs} room${errs === 1 ? '' : 's'} with a spacing or coverage problem: MepApp places the stamps, but check them. ` : ''}${others} other rooms do not match this rule.</span></div>`;
  return m;
}

// ---------- Side panel ----------
function viewSide() {
  const mode = S.view ?? (S.step >= 3 && S.step <= 5 ? 'room' : 'floor');
  const sample = ROOMS.find((x) => x.id === S.sample); const res = calc(sample); const r = rule(); const v = res.v;
  let h = `<div class="panel"><div class="panel-head"><span class="pt">${mode === 'room' ? 'Sample room' : 'Floor plan'}</span><div class="seg" role="group" aria-label="View"><button type="button" class="${mode === 'room' ? 'on' : ''}" data-act="view" data-v="room">This room</button><button type="button" class="${mode === 'floor' ? 'on' : ''}" data-act="view" data-v="floor">Whole floor</button></div></div>`;
  if (mode === 'room') {
    h += `<div class="facts"><span class="fact">${fmt(v.A)} m²</span><span class="fact">${fmt2(v.L)} × ${fmt2(v.W)} m</span>` +
      (r.needsPeople ? `<span class="fact${v.people ? '' : ' missing'}">${v.people ? `${v.people.count} persons <small>${esc(v.people.src)}</small>` : '? persons'}</span>` : '') +
      (r.needsVolume ? `<span class="fact">${fmt(v.V)} m³ <small>ceiling ${S.ceiling} m</small></span>` : '') + `</div>`;
  }
  h += planSvg(mode);
  h += mode === 'room'
    ? `<div class="legend"><span style="--sw:var(--accent-soft)">room</span><span style="--sw:var(--band)">min distance to walls</span>${r.radius ? '<span style="--sw:rgba(23,90,138,.12)">coverage circle</span>' : ''}${S.step === 4 && r.gap ? '<span style="--sw:rgba(47,125,79,.2)">min distance between stamps</span>' : ''}<span class="plain">click a room to use it</span></div>`
    : `<div class="legend"><span style="--sw:var(--accent-soft)">matches the rule</span><span style="--sw:var(--surface)">does not match</span><span style="--sw:var(--warn-soft)">no room type or missing data</span>${S.step >= 3 ? '<span style="--sw:var(--bad-soft)">stamps do not fit</span>' : ''}<span class="plain">click a room to use it</span></div>`;
  h += `</div>`;
  if (S.step >= 3 && matches(sample)) {
    const rowc = (cls, label, why, n) => `<div class="cr ${cls}"><span class="cl">${label}</span><span class="cw">${why}</span><span class="cn">${n}</span></div>`;
    h += `<div class="panel"><div class="panel-head"><span class="pt">Why ${res.count ?? '?'} stamp${res.count === 1 ? '' : 's'}?</span><span class="note">${esc(sample.name)}</span></div><div class="chain">`;
    if (S.method === 'coverage') h += r.radius ? rowc(res.minHit || res.maxHit ? '' : 'win', 'By coverage', `Circles of ${fmt(r.radius, 2)} m (${r.radiusFrom}) cover the room`, res.base) : rowc('blocked', 'By coverage', 'Enter a coverage limit (step 3)', '?');
    else if (res.count == null) h += rowc('blocked', method().name, 'Room data is missing (step 3)', '?');
    else h += rowc(res.minHit || res.maxHit ? '' : 'win', method().name, res.qty != null ? `${fmt(res.required)} ${esc(r.unit)} ÷ ${fmt(r.capacity)} per stamp, rounded up` : 'No capacity per stamp: one stamp per room', res.base);
    if (r.min !== undefined) h += rowc(res.minHit ? 'cap' : '', 'Min count', res.minHit ? 'Raises the count' : 'Not needed here', r.min);
    if (r.max !== undefined) h += rowc(res.maxHit ? 'cap' : '', 'Max count', res.maxHit ? 'Limits the count' : 'Not needed here', r.max);
    h += rowc('res', 'Stamps in this room', res.count == null ? 'Cannot calculate yet' : 'Spacing and layout do not change this number', res.count ?? '?');
    h += `</div>`;
    if (res.each != null) h += `<p class="note">Each stamp gets ${fmt(res.each)} ${esc(r.unit)} (${fmt(res.required)} ÷ ${res.count}). MepApp writes this capacity to the stamp.</p>`;
    if (res.problems.length) h += `<div class="callout bad">${res.problems.map((q) => esc(q.text)).join(' ')}</div>`;
    h += `</div>`;
  } else if (S.step >= 3) h += `<div class="panel"><p class="note">${esc(sample.name)} does not match this rule. Click a blue room on the plan.</p></div>`;
  return h;
}

// ---------- Render ----------
const $ = (id) => document.getElementById(id);
function renderSteps() {
  $('steps').innerHTML = STEP_TITLES.map((t, i) => { const n = i + 1; const [st, sub] = stepStatus(n); return `<button type="button" class="step-btn ${st}${S.step === n ? ' on' : ''}" data-act="go" data-v="${n}" aria-current="${S.step === n ? 'step' : 'false'}"><span class="n">${st === 'ok' && S.step !== n ? '✓' : n}</span><span class="t">${t}</span><span class="s">${esc(sub)}</span></button>`; }).join('');
}
function refresh() {
  if (cache.size > 400) cache.clear();
  renderSteps();
  const m = live();
  document.querySelectorAll('[data-live]').forEach((el) => { el.innerHTML = m[el.dataset.live] ?? ''; });
  $('side').innerHTML = viewSide();
  $('rule-name').textContent = `Rule: ${S.name}`;
}
function render() { $('step').innerHTML = viewStep(); refresh(); }

document.addEventListener('input', (e) => {
  const el = e.target;
  if (el.dataset.k) { S[el.dataset.k] = el.value; S.placed = false; if (el.tagName === 'SELECT') return render(); refresh(); }
  else if (el.dataset.app) { S.areaPerPerson[el.dataset.app] = el.value; S.placed = false; refresh(); }
});
document.addEventListener('change', (e) => {
  const el = e.target;
  if (el.dataset.rt) { S.roomType[el.dataset.rt] = el.value; S.placed = false; render(); }
});
function act(el) {
  const { act: a, v } = el.dataset;
  if (a === 'go') { S.step = Number(v); S.view = null; window.scrollTo({ top: 0 }); }
  if (a === 'stamp') S.stamp = v;
  if (a === 'type') { S.types = S.types.includes(v) ? S.types.filter((x) => x !== v) : [...S.types, v]; if (!matches(ROOMS.find((x) => x.id === S.sample))) S.sample = matched()[0]?.id ?? S.sample; }
  if (a === 'method' && S.method !== v) { const m = METHODS.find((x) => x.id === v); S.method = v; if (m.unit && v !== 'airChanges' && v !== 'lighting') S.flowUnit = m.unit; S.capacity = m.cap; if (v === 'coverage') S.layout = 'evenSpread'; }
  if (a === 'layout') S.layout = v;
  if (a === 'gridStyle') S.gridStyle = v;
  if (a === 'view') S.view = v;
  if (a === 'sample') S.sample = v;
  if (a === 'place') S.placed = true;
  if (a === 'undo') S.placed = false;
  if (!['place', 'undo', 'view', 'sample', 'go'].includes(a)) S.placed = false;
  render();
}
document.addEventListener('click', (e) => {
  if (e.target.closest('.tip')) return;
  const room = e.target.closest('[data-room]');
  if (room) { S.sample = room.dataset.room; if (S.view === 'floor' && S.step >= 3 && S.step <= 5) S.view = null; return render(); }
  const el = e.target.closest('[data-act]'); if (el) act(el);
});
document.addEventListener('keydown', (e) => {
  const el = e.target.closest?.('[role="radio"][data-act]');
  if (el && (e.key === 'Enter' || e.key === ' ')) { e.preventDefault(); act(el); }
});
render();
</script>
