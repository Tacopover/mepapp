[package]
name = "mepsketcher-desktop"
version = "0.1.0"
description = "MEPSketcher desktop app: draws annotated MEP elements onto PDF drawings"
authors = ["MepApp contributors"]
license = "AGPL-3.0-only"
repository = "https://github.com/Tacopover/mepapp"
edition = "2021"
rust-version = "1.77.2"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "mepsketcher_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.11.3", features = [] }
tauri-plugin-log = "2"
