name: Build desktop installer (Windows)

# Never triggered by a push to master: that push publishes the web app.
on:
  workflow_dispatch:
  push:
    tags: ['desktop-v*']

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - run: pnpm install --frozen-lockfile
      # beforeBuildCommand in tauri.conf.json builds the workspace packages and apps/web first.
      - run: pnpm exec tauri build --bundles nsis
        working-directory: apps/desktop
      - uses: actions/upload-artifact@v4
        with:
          name: mepsketcher-desktop-windows-nsis
          path: apps/desktop/src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
